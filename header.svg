<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="sgiath — h+ cypherpunk">
  <!-- card -->
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="818" height="218" rx="11" /></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="219" rx="12" fill="#0a0a0a" stroke="#27272a" />
  <!-- window controls -->
  <circle cx="28" cy="26" r="5" fill="#27272a" />
  <circle cx="46" cy="26" r="5" fill="#27272a" />
  <circle cx="64" cy="26" r="5" fill="#166534" />
  <text x="796" y="30" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#3f3f46">sgiath.dev</text>
  <!-- solar system: tilted elliptical orbits with trailing arcs -->
  <g clip-path="url(#card)">
  <g transform="translate(640, 120)">
    <!-- orbit 1 -->
    <g transform="rotate(-18)">
      <ellipse rx="26" ry="10" fill="none" stroke="#4ade80" stroke-opacity="0.08" />
      <path d="M -22.5 5.0 A 26 10 0 0 1 -22.5 -5.0" fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-linecap="round" />
      <circle cx="-22.5" cy="-5.0" r="1.6" fill="#4ade80" opacity="0.6" />
    </g>
    <!-- orbit 2 -->
    <g transform="rotate(-22)">
      <ellipse rx="52" ry="20" fill="none" stroke="#4ade80" stroke-opacity="0.08" />
      <path d="M 48.9 -6.8 A 52 20 0 0 1 36.8 14.1" fill="none" stroke="#4ade80" stroke-opacity="0.3" stroke-linecap="round" />
      <circle cx="36.8" cy="14.1" r="2.0" fill="#4ade80" opacity="0.55" />
    </g>
    <!-- orbit 3 -->
    <g transform="rotate(-14)">
      <ellipse rx="82" ry="30" fill="none" stroke="#4ade80" stroke-opacity="0.07" />
      <path d="M -80.8 -5.2 A 82 30 0 0 1 -21.2 -29.0" fill="none" stroke="#4ade80" stroke-opacity="0.28" stroke-linecap="round" />
      <circle cx="-21.2" cy="-29.0" r="1.8" fill="#4ade80" opacity="0.5" />
    </g>
    <!-- orbit 4 -->
    <g transform="rotate(-24)">
      <ellipse rx="112" ry="44" fill="none" stroke="#4ade80" stroke-opacity="0.06" />
      <path d="M 64.2 36.0 A 112 44 0 0 1 -64.2 36.0" fill="none" stroke="#4ade80" stroke-opacity="0.22" stroke-linecap="round" />
      <circle cx="-64.2" cy="36.0" r="2.4" fill="#4ade80" opacity="0.45" />
    </g>
    <!-- orbit 5 -->
    <g transform="rotate(-17)">
      <ellipse rx="145" ry="58" fill="none" stroke="#4ade80" stroke-opacity="0.05" />
      <path d="M -49.6 -54.5 A 145 58 0 0 1 118.8 -33.3" fill="none" stroke="#4ade80" stroke-opacity="0.18" stroke-linecap="round" />
      <circle cx="118.8" cy="-33.3" r="2.0" fill="#4ade80" opacity="0.4" />
    </g>
    <!-- sun -->
    <circle r="4" fill="#4ade80" opacity="0.65" />
  </g>
  </g>
  <!-- terminal -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace">
    <text x="36" y="84" font-size="15" xml:space="preserve"><tspan fill="#71717a">~ $ </tspan><tspan fill="#e4e4e7">whoami</tspan></text>
    <text x="36" y="132" font-size="38" font-weight="600" fill="#4ade80">sgiath</text>
    <text x="36" y="166" font-size="15" fill="#a1a1aa">h+ cypherpunk · reimplementing privacy protocols in Elixir</text>
    <text x="36" y="196" font-size="15" fill="#71717a">~ $</text>
    <rect x="78" y="184" width="9" height="15" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
