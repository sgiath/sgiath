<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="sgiath — h+ cypherpunk">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="818" height="218" rx="11" /></clipPath>
  </defs>
  <!-- card -->
  <rect x="0.5" y="0.5" width="819" height="219" rx="12" fill="#0a0a0a" stroke="#27272a" />
  <!-- window controls -->
  <circle cx="28" cy="26" r="5" fill="#27272a" />
  <circle cx="46" cy="26" r="5" fill="#27272a" />
  <circle cx="64" cy="26" r="5" fill="#166534" />
  <text x="796" y="30" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#3f3f46">sgiath.dev</text>
  <!--
    solar system: tilted elliptical orbits with moving planets.
    Each orbit is a circle inside a rotate+scale(1, k) coordinate system, which
    turns circular motion into elliptical motion. Trail + planet live in one
    rotating group so the trail stays behind the planet. Strokes use
    vector-effect="non-scaling-stroke" so the scale does not distort them.
  -->
  <g clip-path="url(#card)">
  <g transform="translate(640, 120)" fill="none" stroke="#4ade80">
    <!-- orbit 1: rx 26, ry 10 -->
    <g transform="rotate(-18) scale(1, 0.3846)">
      <circle r="26" stroke-opacity="0.08" vector-effect="non-scaling-stroke" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="190" to="550" dur="20s" repeatCount="indefinite" />
        <path d="M 8.9 -24.4 A 26 26 0 0 1 26 0" stroke-opacity="0.35" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <path d="M 26 0 l 0 0.01" stroke-opacity="0.6" stroke-width="3.2" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      </g>
    </g>
    <!-- orbit 2: rx 52, ry 20 -->
    <g transform="rotate(-22) scale(1, 0.3846)">
      <circle r="52" stroke-opacity="0.08" vector-effect="non-scaling-stroke" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="36s" repeatCount="indefinite" />
        <path d="M 17.8 -48.9 A 52 52 0 0 1 52 0" stroke-opacity="0.3" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <path d="M 52 0 l 0 0.01" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      </g>
    </g>
    <!-- orbit 3: rx 82, ry 30 -->
    <g transform="rotate(-14) scale(1, 0.3659)">
      <circle r="82" stroke-opacity="0.07" vector-effect="non-scaling-stroke" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="235" to="595" dur="60s" repeatCount="indefinite" />
        <path d="M 28.0 -77.1 A 82 82 0 0 1 82 0" stroke-opacity="0.28" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <path d="M 82 0 l 0 0.01" stroke-opacity="0.5" stroke-width="3.6" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      </g>
    </g>
    <!-- orbit 4: rx 112, ry 44 -->
    <g transform="rotate(-24) scale(1, 0.3929)">
      <circle r="112" stroke-opacity="0.06" vector-effect="non-scaling-stroke" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="100" to="460" dur="95s" repeatCount="indefinite" />
        <path d="M 38.3 -105.2 A 112 112 0 0 1 112 0" stroke-opacity="0.22" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <path d="M 112 0 l 0 0.01" stroke-opacity="0.45" stroke-width="4.8" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      </g>
    </g>
    <!-- orbit 5: rx 145, ry 58 -->
    <g transform="rotate(-17) scale(1, 0.4)">
      <circle r="145" stroke-opacity="0.05" vector-effect="non-scaling-stroke" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="300" to="660" dur="140s" repeatCount="indefinite" />
        <path d="M 49.6 -136.3 A 145 145 0 0 1 145 0" stroke-opacity="0.18" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <path d="M 145 0 l 0 0.01" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      </g>
    </g>
    <!-- sun -->
    <circle r="4" fill="#4ade80" stroke="none" opacity="0.65" />
  </g>
  </g>
  <!-- terminal -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace">
    <text x="36" y="84" font-size="15" xml:space="preserve"><tspan fill="#71717a">~ $ </tspan><tspan fill="#e4e4e7">whoami</tspan></text>
    <text x="36" y="132" font-size="38" font-weight="600" fill="#4ade80">sgiath</text>
    <text x="36" y="166" font-size="15" fill="#a1a1aa">h+ cypherpunk · reimplementing privacy protocols in Elixir</text>
    <text x="36" y="196" font-size="15" fill="#71717a">~ $</text>
    <rect x="78" y="184" width="9" height="15" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
